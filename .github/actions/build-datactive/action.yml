name: build-datactive
description: |
  DatActive web + server image build (Buildkit, daemon'sız).
  Job container: moby/buildkit (buildkitd + buildctl hazır içinde).
  İki repoyu checkout eder, WORKDIR altında birleştirir ve
  datactive.core.server/configurations/Dockerfile ile image üretir.

inputs:
  branch_web:
    description: "Web uygulaması branch adı"
    required: true
  branch_server:
    description: "Server uygulaması branch adı"
    required: true
  tag:
    description: "Build tag'i (CONTRACT §1)"
    required: true
  web_repo:
    description: "Web repo (owner/repo)"
    required: false
    default: "mertbektaas/datateam-web"
  server_repo:
    description: "Server repo (owner/repo)"
    required: false
    default: "mertbektaas/datateam-core.server"
  image_name:
    description: "Hedef image adı (registry/owner/name)"
    required: false
    default: "harbor.datactive.net/datateam/datactive.web"
  token:
    description: "GitHub PAT — private repo checkout için (C2.1)"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Workdir hazırla
      shell: bash
      run: |
        WORKDIR="${{ github.workspace }}/datactive-build"
        mkdir -p "$WORKDIR"
        echo "workdir=$WORKDIR" >> "$GITHUB_ENV"
        echo "WORKDIR=$WORKDIR"

    - name: Web repo checkout
      shell: bash
      env:
        REPO_URL: "https://x-access-token:${{ inputs.token }}@github.com/${{ inputs.web_repo }}.git"
      run: |
        git clone --depth 1 --branch "${{ inputs.branch_web }}" \
          "$REPO_URL" "${{ env.workdir }}/datactive.web"

    - name: Server repo checkout
      shell: bash
      env:
        REPO_URL: "https://x-access-token:${{ inputs.token }}@github.com/${{ inputs.server_repo }}.git"
      run: |
        git clone --depth 1 --branch "${{ inputs.branch_server }}" \
          "$REPO_URL" "${{ env.workdir }}/datactive.core.server"

    - name: Image build (buildctl → buildkitd daemon)
      shell: bash
      env:
        # Cluster'daki buildkitd daemon'ı (arc-runners namespace)
        BUILDKIT_HOST: tcp://buildkitd.arc-runners.svc:1234
      run: |
        buildctl build \
          --frontend dockerfile.v0 \
          --local context="${{ env.workdir }}" \
          --local dockerfile="${{ env.workdir }}/datactive.core.server/configurations" \
          --output type=image,name="${{ inputs.image_name }}:${{ inputs.tag }}",push=true

    - name: Workdir temizle
      shell: bash
      if: always()
      run: |
        rm -rf "${{ env.workdir }}"
        echo "Temp workspace temizlendi."
