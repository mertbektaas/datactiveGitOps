name: validate-overlay
description: |
  Kustomize overlay doğrulayıcı.
  Verilen overlay path için kustomize build çalıştırır;
  bozuk/eksik overlay fail döner (ArgoCD'den önce güvenlik ağı).

inputs:
  overlay_path:
    description: "Doğrulanacak overlay klasörü (repo köküne göre)"
    required: true

runs:
  using: composite
  steps:
    - name: Kustomize kur (yoksa)
      shell: bash
      run: |
        if ! command -v kustomize >/dev/null 2>&1; then
          KUSTOMIZE_VERSION=v5.4.3
          curl -sSLo /tmp/kustomize.tar.gz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_arm64.tar.gz"
          tar -xzf /tmp/kustomize.tar.gz -C /usr/local/bin kustomize
          rm /tmp/kustomize.tar.gz
        fi
        kustomize version

    - name: Overlay doğrula
      shell: bash
      run: |
        TARGET="${{ inputs.overlay_path }}"
        FAILED=0

        # Tek overlay mi, yoksa overlay koleksiyonu mu?
        if [[ -f "$TARGET/kustomization.yaml" ]]; then
          OVERLAYS=("$TARGET")
        else
          # Koleksiyon: kustomization.yaml içeren alt klasörleri bul
          mapfile -t OVERLAYS < <(find "$TARGET" -name kustomization.yaml -exec dirname {} \; | sort)
        fi

        if [[ ${#OVERLAYS[@]} -eq 0 ]]; then
          echo "HATA: '$TARGET' içinde kustomization.yaml bulunamadı."
          echo "      En az bir geçerli overlay olmalıdır."
          exit 1
        fi

        for OVERLAY in "${OVERLAYS[@]}"; do
          echo "==> kustomize build $OVERLAY"
          if ! kustomize build "$OVERLAY" > /tmp/kustomize-output.yaml; then
            echo "HATA: $OVERLAY — kustomize build başarısız, overlay bozuk."
            echo "      ArgoCD bu overlay'i uygulayamazdı."
            FAILED=1
            continue
          fi
          COUNT=$(grep -c '^kind:' /tmp/kustomize-output.yaml || true)
          echo "OK: $OVERLAY — $COUNT kaynak üretildi."

          # --- SEMANTİK KONTROL (K1.10 overlay uyumu) ---
          KUSTOMIZATION="$OVERLAY/kustomization.yaml"

          # 1) Image adı: base'deki gerçek image adıyla eşleşmeli
          BASE_IMAGES=$(grep -rh "image:" "${{ github.workspace }}/manifests/base/deployment.yaml" 2>/dev/null | sed 's/.*image: *//' | sed 's/:.*//' || true)
          for IMG in $BASE_IMAGES; do
            if ! grep -q "$IMG" "$KUSTOMIZATION"; then
              echo "HATA: $OVERLAY — image adı '$IMG' overlay'de yok/yanlış."
              echo "      K1.10: 'harbor.datactive.net/datateam/datactive.web' olmalı (base ile aynı)."
              FAILED=1
            fi
          done

          # 2) Schema env'i: CONTRACT'taki doğru değişken adları kullanılmalı
          if grep -q "DB_SCHEMA" "$KUSTOMIZATION"; then
            echo "HATA: $OVERLAY — 'DB_SCHEMA' yanlış değişken adı."
            echo "      Doğrusu: DQLSchema (veya CustomerMetadataSchema, ORACLEDataSchema)."
            FAILED=1
          fi

          # 3) Schema literals'i olmalı (ConfigMap merge kontrolü)
          if ! grep -qE "DQLSchema" "$KUSTOMIZATION"; then
            echo "UYARI: $OVERLAY — DQLSchema literal'i bulunamadı (schema ConfigMap'e eklenmemiş olabilir)."
          fi
        done

        rm -f /tmp/kustomize-output.yaml
        exit $FAILED
