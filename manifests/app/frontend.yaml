# Frontend (nginx — Expo web) deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: datactive-frontend
  labels:
    app: datactive-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: datactive-frontend
  template:
    metadata:
      labels:
        app: datactive-frontend
    spec:
      containers:
        - name: frontend
          image: datactive-registry:5000/datateam/datactive-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          env:
            # Frontend, backend'e cluster içinden ulaşır (build zamanı değil, runtime)
            - name: EXPO_PUBLIC_API_URL
              value: "http://datactive-backend:8080"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: 64Mi
            limits:
              cpu: "200m"
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: datactive-frontend
  labels:
    app: datactive-frontend
spec:
  selector:
    app: datactive-frontend
  ports:
    - port: 80
      targetPort: 80
      name: http
  type: NodePort
