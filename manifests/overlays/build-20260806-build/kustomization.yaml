apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: build-20260806-build

resources:
  - "../../base"

images:
  - name: datactive-registry:5000/datateam/datactive.web
    newTag: "BUILD-20260806-145927"

configMapGenerator:
  - name: datactive-config
    behavior: merge
    literals:
      - DQLSchema=final_test
      - CustomerMetadataSchema=final_test.
      - ORACLEDataSchema=final_test.

patches:
  - target:
      kind: Deployment
      name: datactive-web
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: datactive-registry:5000/datateam/datactive.web:BUILD-20260806-145927
