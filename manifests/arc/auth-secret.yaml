# ARC GitHub Authentication — Secret Şablonu
#
# GitHub'a bağlanmak için gereken kimlik bilgisi.
# İki yöntem var: GitHub App (önerilen) veya PAT.
#
# ⚠️ Bu şablon; kurulum sırasında gerçek değerlerle doldurulur.
# Gerçek credential'lar repo'ya konmaz — SealedSecret'a dönüştürülür (K2.12).
#
# GitHub App yöntemi (önerilen):
#   github_app_id: "123456"
#   github_app_installation_id: "789012"
#   github_app_private_key: "-----BEGIN RSA PRIVATE KEY-----..."
#
# PAT yöntemi (classic, repo + admin:org scope):
#   github_token: "ghp_..."

apiVersion: v1
kind: Secret
metadata:
  name: arc-auth
type: Opaque
stringData:
  github_app_id: "PLACEHOLDER_APP_ID"
  github_app_installation_id: "PLACEHOLDER_INSTALLATION_ID"
  github_app_private_key: "PLACEHOLDER_PRIVATE_KEY"
