# Buildkitd daemon — cluster'da daemon'sız build sunucusu
# Job'lar (buildctl) bu servise bağlanarak image build eder.

apiVersion: v1
kind: ConfigMap
metadata:
  name: buildkitd-config
  namespace: arc-runners
data:
  buildkitd.toml: |
    # Test ortamı: k3d registry HTTP (TLS'siz)
    [registry."datactive-registry:5000"]
      http = true
      insecure = true

    # Push kimliği (test ortamı). Production'da Harbor robot hesabı.
    # NOT: Şifre düz metin — production'da Secret ile mount edilir (K2.12 Sealed Secrets).
    [registry."datactive-registry:5000".auth]
      username = "testuser"
      password = "testpass123"

---
apiVersion: v1
kind: Service
metadata:
  name: buildkitd
  namespace: arc-runners
spec:
  selector:
    app: buildkitd
  ports:
    - name: grpc
      port: 1234
      targetPort: 1234
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildkitd
  namespace: arc-runners
  labels:
    app: buildkitd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: buildkitd
  template:
    metadata:
      labels:
        app: buildkitd
    spec:
      containers:
        - name: buildkitd
          image: moby/buildkit:v0.32.2
          command: ["buildkitd", "--oci-worker=true", "--containerd-worker=false", "--addr=tcp://0.0.0.0:1234", "--config=/etc/buildkitd.toml"]
          ports:
            - containerPort: 1234
              name: grpc
          volumeMounts:
            - name: buildkit-data
              mountPath: /var/lib/buildkit
            - name: buildkit-config
              mountPath: /etc/buildkitd.toml
              subPath: buildkitd.toml
              readOnly: true
          resources:
            requests:
              cpu: "500m"
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          # Buildkitd build sırasında mount/cgroup işlemleri yapar.
          # Sadece bu daemon pod'una özel (runner pod'una değil).
          securityContext:
            privileged: true
            capabilities:
              add: ["SYS_ADMIN"]
      volumes:
        - name: buildkit-data
          persistentVolumeClaim:
            claimName: buildkitd-pvc
        - name: buildkit-config
          configMap:
            name: buildkitd-config
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: buildkitd-pvc
  namespace: arc-runners
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
