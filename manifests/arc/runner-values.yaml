# ARC Runner Scale Set — Helm Değerleri
# Kurulum: helm install arc-runner-set --namespace arc-runners --create-namespace \
#   --values manifests/arc/runner-values.yaml \
#   oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set

# Workflow'larda runs-on: arc-runner-set (installation name)
nameOverride: arc-runner-set

githubConfigUrl: "https://github.com/mertbektaas/datactiveGitOps"
githubConfigSecret: arc-auth

# --- Autoscaling (production) ---
runnerScaleSet:
  # Minimum 0: boştayken runner pod'u YOK, maliyet 0
  capacity:
    minRunners: 0
    maxRunners: 10

  # Job sırasındaki bekleme: runner yoksa job 60 sn içinde başlatılır
  maxRunnerScaleUpTime: 60s

  # Her job bitiminde pod silinir (ephemeral) — izolasyon
  podRetention: none

# --- Container mode (Kaniko için kubernetes modu) ---
containerMode:
  type: kubernetes

template:
  spec:
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:2.336.0
        command: ["/home/runner/run.sh"]
        env:
          - name: ACTIONS_RUNNER_CONTAINER_HOOKS
            value: /home/runner/k8s/index.js
          - name: ACTIONS_RUNNER_POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
            # Job'lar izole container'da koşar (kubernetes mode izolasyonu).
            # Workflow'larda container: bloğu tanımlıdır (build.yml, runner-test.yml).
            value: "true"
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
        resources:
          # Test ortamı (k3d, node başına ~4GB RAM)
          # Production'da: requests 2CPU/4Gi, limits 4CPU/8Gi
          requests:
            cpu: "500m"
            memory: 1Gi
          limits:
            cpu: "2"
            memory: 2Gi
        securityContext:
          runAsUser: 1001
          runAsGroup: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
    volumes:
      - name: work
        ephemeral:
          volumeClaimTemplate:
            spec:
              accessModes: ["ReadWriteOnce"]
              storageClassName: "local-path"
              resources:
                requests:
                  storage: 1Gi
